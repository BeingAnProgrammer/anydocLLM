<button
  type="button"
  class="dropzone"
  [class.drag]="isDragOver()"
  (click)="fileInput.click()"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave()"
  (drop)="onDrop($event)"
>
  <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="icon" aria-hidden="true">
    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
    <path d="M14 2v6h6"></path>
    <path d="M12 18v-6"></path>
    <path d="m9 15 3-3 3 3"></path>
  </svg>
  <p class="title">Drop your document here</p>
  <p class="hint">or click to browse</p>
  <div class="tags">
    @for (format of formats; track format.format) {
      <span class="tag tag-outline">{{ format.label }}</span>
    }
  </div>
  <p class="limit">Maximum file size: 25 MB</p>
</button>
<input #fileInput type="file" class="hidden-input" [accept]="accept" (change)="onFileInputChange($event)" tabindex="-1" />
