<div class="card">
  <div class="card-header">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" class="icon">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
      <path d="M14 2v6h6"></path>
    </svg>
    <div class="meta">
      <p class="name">{{ document().name }}</p>
      <p class="details text-muted">{{ document().sizeLabel }} · {{ document().extension.toUpperCase() }}</p>
      <p class="ready">✓ Ready to convert</p>
    </div>
  </div>
  <div class="actions">
    <button type="button" class="btn btn-primary" (click)="convert.emit()">Convert to Markdown</button>
    <button type="button" class="btn btn-secondary" (click)="remove.emit()">Remove</button>
  </div>
</div>
