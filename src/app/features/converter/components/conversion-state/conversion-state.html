<div class="conversion-state">
  <p class="headline">Converting your document…</p>
  <p class="subline text-muted">{{ document().name }} · {{ document().sizeLabel }}</p>

  <div class="progress-track" role="progressbar" aria-label="Converting document" aria-valuetext="In progress">
    <div class="progress-fill"></div>
  </div>

  <ol class="stages">
    @for (stage of stages; track stage.label; let i = $index) {
      <li class="stage" [class.done]="i < stageIndex()" [class.active]="i === stageIndex()">
        <span class="stage-dot" aria-hidden="true"></span>
        <span class="stage-label">{{ stage.label }}</span>
        <span class="stage-mark">
          @if (i < stageIndex()) {
            Done
          } @else if (i === stageIndex()) {
            Working
          }
        </span>
      </li>
    }
  </ol>
</div>
