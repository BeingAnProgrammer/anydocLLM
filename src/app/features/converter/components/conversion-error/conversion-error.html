<div class="error-card" role="alert">
  <h2 class="title">Unable to convert this document</h2>
  <p class="message text-muted">{{ error().message }}</p>
  <div class="actions">
    <button type="button" class="btn btn-primary" (click)="retry.emit()">Try again</button>
    <button type="button" class="btn btn-secondary" (click)="chooseAnother.emit()">Choose another document</button>
  </div>
</div>
